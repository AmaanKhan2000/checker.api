[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "api-sentinel"
version = "1.0.0"
description = "Distributed, contract-driven API test automation with leased Redis jobs"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "httpx==0.28.1",
  "redis==8.1.0",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "jsonschema[format]==4.26.0",
  "referencing==0.37.0",
]

[project.optional-dependencies]
demo = ["fastapi==0.141.1", "uvicorn==0.52.4"]

[dependency-groups]
dev = [
  "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.6",
  "fakeredis[lua]==2.38.0", "build==1.6.0",
]

[project.scripts]
sentinel = "api_sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/api_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires a real Redis instance via TEST_REDIS_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["api_sentinel"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
